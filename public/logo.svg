<svg width="220" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo TC Circle -->
  <g transform="translate(8, 8)">
    <!-- Circle with white background -->
    <circle cx="22" cy="22" r="22" fill="white" stroke="#e0e0e0" stroke-width="0.5"/>
    
    <!-- TC Logo -->
    <g transform="translate(22, 22)">
      <!-- Blue top half -->
      <path d="M -22 -22 L 22 -22 L 22 0 L -22 0 Z" fill="#0066CC"/>
      
      <!-- Maroon bottom half -->
      <path d="M -22 0 L 22 0 L 22 22 L -22 22 Z" fill="#8B0000"/>
      
      <!-- White TC Letters -->
      <g fill="white">
        <!-- Letter T - Left -->
        <!-- Top horizontal bar -->
        <rect x="-13" y="-11" width="9" height="3" rx="0.3"/>
        <!-- Vertical stem -->
        <rect x="-9.5" y="-11" width="3" height="18" rx="0.3"/>
        
        <!-- Letter C - Right with angular top -->
        <!-- Main C body -->
        <rect x="0" y="-11" width="3" height="22" rx="0.3"/>
        <!-- Top horizontal with angular extension -->
        <rect x="0" y="-11" width="6" height="3" rx="0.3"/>
        <!-- Angular top-right corner (arrow-like) -->
        <path d="M 6 -11 L 9 -8 L 6 -8 Z" fill="white"/>
        <!-- Bottom horizontal -->
        <rect x="0" y="8" width="6" height="3" rx="0.3"/>
        <!-- Inner curve (cut out) -->
        <rect x="3" y="-5" width="2" height="10" fill="#0066CC"/>
        <rect x="3" y="-5" width="2" height="10" fill="#8B0000"/>
      </g>
    </g>
  </g>
  
  <!-- Text "Siêu thị Điện máy Thế" -->
  <g transform="translate(60, 0)">
    <text x="0" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#logoGrad)">
      Siêu thị Điện máy Thế
    </text>
    <text x="0" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#667eea" opacity="0.8">
      Thiết bị điện tử
    </text>
  </g>
</svg>
