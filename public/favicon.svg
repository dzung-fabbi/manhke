<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg">
  <!-- Circle background -->
  <circle cx="16" cy="16" r="16" fill="white"/>
  
  <!-- TC Logo -->
  <g transform="translate(16, 16)">
    <!-- Blue top half -->
    <path d="M -16 -16 L 16 -16 L 16 0 L -16 0 Z" fill="#0066CC"/>
    
    <!-- Maroon bottom half -->
    <path d="M -16 0 L 16 0 L 16 16 L -16 16 Z" fill="#8B0000"/>
    
    <!-- White TC Letters -->
    <g fill="white">
      <!-- Letter T -->
      <rect x="-9" y="-7" width="6" height="2" rx="0.2"/>
      <rect x="-6.5" y="-7" width="2" height="13" rx="0.2"/>
      
      <!-- Letter C -->
      <rect x="0" y="-7" width="2" height="13" rx="0.2"/>
      <rect x="0" y="-7" width="4" height="2" rx="0.2"/>
      <!-- Angular top-right -->
      <path d="M 4 -7 L 6 -5 L 4 -5 Z" fill="white"/>
      <rect x="0" y="5" width="4" height="2" rx="0.2"/>
      <!-- Inner curve cut -->
      <rect x="2" y="-3" width="1.5" height="6" fill="#0066CC"/>
      <rect x="2" y="-3" width="1.5" height="6" fill="#8B0000"/>
    </g>
  </g>
</svg>
